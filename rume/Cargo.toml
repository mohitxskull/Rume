[package]
name = "rume"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Explicit, typed, production-ready application shell for Axum."

[dependencies]
# Core HTTP substrate.
axum.workspace = true
# Async runtime.
tokio.workspace = true
# Serialization.
serde.workspace = true
# Tracing.
tracing.workspace = true
# Error derives.
thiserror.workspace = true
# Secret handling.
secrecy.workspace = true
# Layered configuration with provenance.
figment.workspace = true
# .env loading.
dotenvy.workspace = true
# URL/newtype validation helpers.
url.workspace = true
# TOML configuration files.
toml.workspace = true
# Optional JSON Schema generation.
schemars = { version = "1.2.3", optional = true, features = ["derive"] }
serde_json = "1.0.154"
# Tracing/logging.
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
# Tower utilities for testing and middleware.
tower = "0.5.3"
# Request validation.
garde = { version = "0.23.0", features = ["derive", "email", "url"] }
uuid = { version = "1.29.0", features = ["v4"] }
sha2 = "0.10.9"
hmac = "0.12.1"
tokio-postgres = { workspace = true, optional = true }
deadpool-postgres = { workspace = true, optional = true }
deadpool-redis = { workspace = true, optional = true }
redis = { workspace = true, optional = true }
rusqlite = { workspace = true, optional = true }

[features]
default = ["sqlite"]
postgres = ["dep:tokio-postgres", "dep:deadpool-postgres"]
redis = ["dep:deadpool-redis", "dep:redis"]
sqlite = ["dep:rusqlite"]

[dev-dependencies]
tempfile = "3.27.0"
testcontainers-modules = { workspace = true }
