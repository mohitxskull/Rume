[package]
name = "rume"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Explicit, typed, production-ready application shell for Axum."

[dependencies]
# Core HTTP substrate.
axum.workspace = true
# Async runtime.
tokio.workspace = true
futures-util.workspace = true
# Serialization.
serde.workspace = true
# Tracing.
tracing.workspace = true
# Error derives.
thiserror.workspace = true
# Secret handling.
secrecy.workspace = true
# Layered configuration with provenance.
figment.workspace = true
# .env loading.
dotenvy.workspace = true
# URL/newtype validation helpers.
url.workspace = true
# TOML configuration files.
toml.workspace = true
# Optional JSON Schema generation.
schemars = { version = "1.2.3", optional = true, features = ["derive"] }
serde_json = "1.0.154"
# Tracing/logging.
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
# Tower utilities for testing and middleware.
tower = "0.5.3"
# Request validation.
garde = { version = "0.23.0", features = ["derive", "email", "url"] }
uuid = { version = "1.29.0", features = ["v4"] }
sha2 = "0.10.9"
hmac = "0.12.1"
sqlx = { workspace = true, optional = true }
deadpool-redis = { workspace = true, optional = true }
redis = { workspace = true, optional = true }
quick-xml = { version = "0.42.0", optional = true }
rume-macros = { path = "../rume-macros", version = "0.1.0" }

[features]
default = ["sqlite", "saml", "testing"]
testing = []
postgres = ["dep:sqlx", "sqlx/postgres"]
redis = ["dep:deadpool-redis", "dep:redis"]
sqlite = ["dep:sqlx", "sqlx/sqlite"]
mysql = ["dep:sqlx", "sqlx/mysql"]
saml = ["dep:quick-xml"]
enterprise = ["saml"]

[dev-dependencies]
tempfile = "3.27.0"
testcontainers-modules = { workspace = true }
insta = { version = "1.49", features = ["json"] }
rstest = "0.28"
wiremock = "0.6"
ureq = "3.5"
proptest = "1.6"

[[test]]
name = "integration"
path = "tests/integration.rs"

[[test]]
name = "containers"
path = "tests/containers.rs"
