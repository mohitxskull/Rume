[package]
name = "rume"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Explicit, typed, production-ready application shell for Axum."

[dependencies]
# Core HTTP substrate.
axum.workspace = true
# Async runtime.
tokio.workspace = true
# Serialization.
serde.workspace = true
# Tracing.
tracing.workspace = true
# Error derives.
thiserror.workspace = true
# Secret handling.
secrecy.workspace = true
# Layered configuration with provenance.
figment.workspace = true
# .env loading.
dotenvy.workspace = true
# URL/newtype validation helpers.
url.workspace = true
# TOML configuration files.
toml.workspace = true
# Request validation. Kept as a dependency because validation is part of the
# v1 contract, not an optional extra (see .opencode/rules/85-minimalism.md).
garde = { version = "0.23.0", features = ["derive"] }

[dev-dependencies]
tempfile = "3.27.0"
