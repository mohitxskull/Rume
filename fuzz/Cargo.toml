[package]
name = "rume-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4.13"
rume-data = { path = "../crates/data", features = ["fuzzing"] }
rume-enterprise = { path = "../crates/enterprise", features = ["enterprise"] }
rume-foundation = { path = "../crates/foundation" }
rume-observability = { path = "../crates/observability" }
serde_json = "1.0.154"

[[bin]]
name = "saml_parser"
path = "fuzz_targets/saml_parser.rs"
test = false
doc = false
bench = false

[[bin]]
name = "scim_deser"
path = "fuzz_targets/scim_deser.rs"
test = false
doc = false
bench = false

[[bin]]
name = "sql_validators"
path = "fuzz_targets/sql_validators.rs"
test = false
doc = false
bench = false

[[bin]]
name = "trace_context"
path = "fuzz_targets/trace_context.rs"
test = false
doc = false
bench = false

[[bin]]
name = "env_interpolation"
path = "fuzz_targets/env_interpolation.rs"
test = false
doc = false
bench = false
