[package]
name = "rume-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Application builder, lifecycle management, and modular composition for Rume."

[dependencies]
rume-foundation.workspace = true
rume-observability.workspace = true
rume-http.workspace = true
axum.workspace = true
tower.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true

[features]
default = []
tls = ["rume-http/tls"]
acme = ["tls", "rume-http/acme"]
static-embed = ["rume-http/static-embed"]

[dev-dependencies]
rume-data.workspace = true
rume-security.workspace = true
tokio-rustls.workspace = true
rustls.workspace = true
rustls-pki-types.workspace = true
rustls-pemfile.workspace = true
