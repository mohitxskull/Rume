[package]
name = "rume-messaging"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Domain events, transactional outbox, and background job queues for Rume."

[dependencies]
rume-foundation.workspace = true
rume-observability.workspace = true
rume-data.workspace = true
tokio.workspace = true
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
thiserror.workspace = true
uuid = { version = "=1.29.3", features = ["v4", "serde"] }
chrono = { workspace = true, features = ["clock"] }
croner.workspace = true
hmac.workspace = true
sha2.workspace = true
hex.workspace = true
secrecy.workspace = true
reqwest.workspace = true
sqlx = { workspace = true, optional = true }
deadpool-redis = { workspace = true, optional = true }
redis = { workspace = true, optional = true }
async-nats = { workspace = true, optional = true }
lapin = { workspace = true, optional = true }
lettre = { workspace = true, optional = true }
minijinja = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
opentelemetry.workspace = true
opentelemetry_sdk.workspace = true
tracing-opentelemetry.workspace = true
tracing-subscriber.workspace = true

[features]
default = []
sqlite = ["rume-data/sqlite", "dep:sqlx", "sqlx/sqlite"]
postgres = ["rume-data/postgres", "dep:sqlx", "sqlx/postgres"]
mysql = ["rume-data/mysql", "dep:sqlx", "sqlx/mysql"]
redis = ["rume-data/redis", "dep:deadpool-redis", "dep:redis"]
nats = ["dep:async-nats"]
rabbitmq = ["dep:lapin"]
mailer = ["dep:lettre", "dep:minijinja"]
