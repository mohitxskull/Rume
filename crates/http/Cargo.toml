[package]
name = "rume-http"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "HTTP routing, OpenAPI generation, request validation, and resilience middleware for Rume."

[dependencies]
rume-foundation.workspace = true
rume-observability.workspace = true
rume-data.workspace = true
rume-security.workspace = true
rume-messaging.workspace = true
rume-enterprise = { workspace = true, optional = true }
axum = { workspace = true, features = ["multipart", "ws"] }
tower.workspace = true
tower-http = { workspace = true, features = ["fs"] }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
thiserror.workspace = true
garde.workspace = true
parking_lot.workspace = true
uuid = { version = "=1.29.3", features = ["v4"] }
reqwest.workspace = true
rand.workspace = true
sha2.workspace = true
hex.workspace = true
hmac.workspace = true
subtle.workspace = true
secrecy.workspace = true
infer.workspace = true
deadpool-redis = { workspace = true, optional = true }
redis = { workspace = true, optional = true }
hickory-resolver = { workspace = true, optional = true }
tokio-rustls = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
rustls-pki-types = { workspace = true, optional = true }
hyper-util = { workspace = true, features = ["server-auto", "server-graceful", "service", "tokio"], optional = true }
rustls-acme = { workspace = true, optional = true }
rust-embed = { workspace = true, optional = true }
futures-util.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tower-http = { workspace = true, features = ["decompression-gzip", "decompression-br", "decompression-zstd"] }
tempfile.workspace = true

[features]
default = []
redis = ["rume-security/redis", "dep:deadpool-redis", "dep:redis"]
dns-srv = ["dep:hickory-resolver"]
tls = [
    "dep:tokio-rustls",
    "dep:rustls",
    "dep:rustls-pki-types",
    "dep:hyper-util",
]
acme = ["tls", "dep:rustls-acme"]
static-embed = ["dep:rust-embed"]
scim = ["dep:rume-enterprise"]
