[package]
name = "rume-data"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Database persistence, caching, and distributed coordination primitives for Rume."

[dependencies]
rume-foundation.workspace = true
rume-observability.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
thiserror.workspace = true
uuid = { version = "=1.29.2", features = ["v4"] }
sha2 = "=0.11.1"
sqlparser = { workspace = true, optional = true }
sqlx = { workspace = true, optional = true }
deadpool-redis = { workspace = true, optional = true }
redis = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
proptest.workspace = true
sqlparser.workspace = true

[features]
default = []
sqlite = ["dep:sqlx", "sqlx/sqlite", "dep:sqlparser"]
postgres = ["dep:sqlx", "sqlx/postgres", "dep:sqlparser"]
mysql = ["dep:sqlx", "sqlx/mysql", "dep:sqlparser"]
redis = ["dep:deadpool-redis", "dep:redis"]
# Exposes internal SQL validation entry points for `fuzz/` targets only.
fuzzing = ["sqlite", "postgres", "mysql"]
