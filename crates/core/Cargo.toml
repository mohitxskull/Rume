[package]
name = "rume"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Explicit, typed, production-ready application shell for Axum."

[dependencies]
# Foundation primitives.
rume-foundation.workspace = true
# Observability (OTel traces, logs, W3C context, Prometheus metrics).
rume-observability.workspace = true
# Persistence, caching, and distributed coordination.
rume-data.workspace = true
# Events, transactional outbox, and background jobs.
rume-messaging.workspace = true
# Authentication, security hardening, and multi-tenancy.
rume-security.workspace = true
# HTTP routing, OpenAPI, validation, and resilience.
rume-http.workspace = true
# Enterprise SAML/SCIM and Saga workflows.
rume-enterprise.workspace = true
# Application builder, lifecycle, and module composition.
rume-app.workspace = true
# Testing helpers, TestApp, TestServer, and declarative harnesses.
rume-testing = { workspace = true, optional = true }
# Optional gRPC server integration.
rume-grpc = { workspace = true, optional = true }
# Optional GraphQL server integration.
rume-graphql = { workspace = true, optional = true }
# Core HTTP substrate (used by `rume::prelude`).
axum.workspace = true
# Serialization (used by `rume::prelude`).
serde.workspace = true
rume-macros = { path = "../../crates/macro", version = "=0.1.0" }

[features]
default = ["sqlite"]
otel = ["rume-observability/otel"]
testing = ["dep:rume-testing", "rume-testing/testing"]
postgres = [
    "rume-data/postgres",
    "rume-messaging/postgres",
    "rume-security/postgres",
    "rume-enterprise/postgres",
    "rume-testing?/postgres",
]
redis = [
    "rume-data/redis",
    "rume-messaging/redis",
    "rume-security/redis",
    "rume-http/redis",
    "rume-enterprise/redis",
]
http-client = ["rume-security/http-client"]
dns-srv = ["rume-http/dns-srv"]
nats = ["rume-messaging/nats"]
rabbitmq = ["rume-messaging/rabbitmq"]
sqlite = [
    "rume-data/sqlite",
    "rume-messaging/sqlite",
    "rume-security/sqlite",
    "rume-enterprise/sqlite",
    "rume-testing?/sqlite",
]
mysql = [
    "rume-data/mysql",
    "rume-messaging/mysql",
    "rume-security/mysql",
    "rume-enterprise/mysql",
    "rume-testing?/mysql",
]
saml = ["rume-enterprise/saml"]
enterprise = ["saml", "rume-enterprise/enterprise"]
schemars = ["rume-foundation/schemars"]
s3 = ["rume-data/s3"]
tls = ["rume-app/tls", "rume-http/tls"]
acme = ["tls", "rume-app/acme", "rume-http/acme"]
static-embed = ["rume-app/static-embed", "rume-http/static-embed"]
mailer = ["rume-messaging/mailer"]
scim = ["rume-http/scim"]
grpc = ["dep:rume-grpc"]
graphql = ["dep:rume-graphql"]

[dev-dependencies]
# Why: `tokio`, `sqlx`, and `uuid` belong in `[dev-dependencies]` rather than runtime
# `[dependencies]` after extracting `rume-crash` to `crates/crash`; Cargo
# feature unification propagates backend `sqlx/*` drivers from `rume-data`/`rume-messaging`
# when tests enable `postgres`, `sqlite`, or `mysql`.
tokio = { workspace = true, features = ["test-util"] }
sqlx.workspace = true
uuid = { version = "=1.29.3", features = ["v4"] }
deadpool-redis.workspace = true
futures-util.workspace = true
garde = { workspace = true, features = ["derive", "email", "url"] }
redis.workspace = true
serde_json = "=1.0.154"
tower = "=0.5.3"
tower-http = { workspace = true, features = ["decompression-gzip", "decompression-br", "decompression-zstd"] }
tracing.workspace = true
tracing-subscriber.workspace = true
tempfile = "=3.27.0"
testcontainers-modules = { workspace = true }
insta = { version = "=1.49.0", features = ["json"] }
rstest = "=0.29.0"
wiremock = "=0.6.5"
ureq = "=3.5.2"
proptest.workspace = true
criterion = { version = "=0.8.2", features = ["async_tokio"] }
base64.workspace = true
bergshamra.workspace = true
rand.workspace = true
rsa.workspace = true
secrecy.workspace = true
sha2.workspace = true
signature.workspace = true
sea-query.workspace = true
tokio-rustls.workspace = true
rustls.workspace = true
rustls-pki-types.workspace = true
tonic.workspace = true
async-graphql.workspace = true

[[test]]
name = "integration"
path = "tests/integration.rs"
required-features = ["testing"]

[[test]]
name = "containers"
path = "tests/containers.rs"
required-features = ["testing"]

[[bench]]
name = "hot_path"
path = "benches/hot_path.rs"
harness = false
