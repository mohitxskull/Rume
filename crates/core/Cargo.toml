[package]
name = "rume"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Explicit, typed, production-ready application shell for Axum."

[dependencies]
# Foundation primitives.
rume-foundation.workspace = true
# Observability (OTel traces, logs, W3C context, Prometheus metrics).
rume-observability.workspace = true
# Persistence, caching, and distributed coordination.
rume-data.workspace = true
# Events, transactional outbox, and background jobs.
rume-messaging.workspace = true
# Authentication, security hardening, and multi-tenancy.
rume-security.workspace = true
# HTTP routing, OpenAPI, validation, and resilience.
rume-http.workspace = true
# Enterprise SAML/SCIM and Saga workflows.
rume-enterprise.workspace = true
# Application builder, lifecycle, and module composition.
rume-app.workspace = true
# Testing helpers, TestApp, TestServer, and declarative harnesses.
rume-testing.workspace = true
# Core HTTP substrate.
axum.workspace = true
# Async runtime.
tokio.workspace = true
futures-util.workspace = true
# Serialization.
serde.workspace = true
# Tracing.
tracing.workspace = true
# Error derives.
thiserror.workspace = true
# Secret handling.
secrecy.workspace = true
# Layered configuration with provenance.
figment.workspace = true
# .env loading.
dotenvy.workspace = true
# URL/newtype validation helpers.
url.workspace = true
# TOML configuration files.
toml.workspace = true
serde_json = "=1.0.154"
# Tracing/logging.
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "fmt"] }
# Tower utilities for testing and middleware.
tower = "=0.5.3"
# Request validation.
garde = { workspace = true, features = ["derive", "email", "url"] }
# Prometheus metrics (workspace pin).
prometheus.workspace = true
uuid = { version = "=1.29.2", features = ["v4"] }
sha2 = "=0.11.1"
hmac = "=0.13.0"
# Constant-time comparison used by `helpers::safe_equal` (RC-14).
subtle.workspace = true
sqlx = { workspace = true, optional = true }
deadpool-redis = { workspace = true, optional = true }
redis = { workspace = true, optional = true }
quick-xml = { version = "=0.42.0", optional = true }
# saml-rs is optional and gated behind the `saml` feature because the SAML
# module is `#[cfg(feature = "saml")]` and experimental. It shares the
# quick-xml 0.42 XML engine saml-rs itself depends on.
saml-rs = { workspace = true, optional = true }
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "stream"], optional = true }
rume-macros = { path = "../../crates/macro", version = "=0.1.0" }

[[bin]]
name = "rume-crash-harness"
path = "src/bin/crash_harness.rs"
required-features = ["postgres", "redis"]

[features]
default = ["sqlite", "testing"]
testing = ["dep:reqwest", "rume-testing/testing"]
postgres = [
    "dep:sqlx",
    "sqlx/postgres",
    "rume-data/postgres",
    "rume-messaging/postgres",
    "rume-testing/postgres",
]
redis = [
    "dep:deadpool-redis",
    "dep:redis",
    "rume-data/redis",
    "rume-messaging/redis",
    "rume-security/redis",
    "rume-http/redis",
]
sqlite = [
    "dep:sqlx",
    "sqlx/sqlite",
    "rume-data/sqlite",
    "rume-messaging/sqlite",
    "rume-testing/sqlite",
]
mysql = [
    "dep:sqlx",
    "sqlx/mysql",
    "rume-data/mysql",
    "rume-messaging/mysql",
    "rume-testing/mysql",
]
saml = ["dep:quick-xml", "dep:saml-rs", "rume-enterprise/saml"]
enterprise = ["saml", "rume-enterprise/enterprise"]
schemars = ["rume-foundation/schemars"]

[dev-dependencies]
tempfile = "=3.27.0"
testcontainers-modules = { workspace = true }
insta = { version = "=1.49.0", features = ["json"] }
rstest = "=0.28.0"
wiremock = "=0.6.5"
ureq = "=3.5.1"
proptest = "=1.12.0"

[[test]]
name = "integration"
path = "tests/integration.rs"

[[test]]
name = "containers"
path = "tests/containers.rs"
