[package]
name = "rume-security"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Authentication, authorization, security hardening, and multi-tenancy primitives for Rume."

[dependencies]
rume-foundation.workspace = true
rume-data.workspace = true
axum.workspace = true
tower.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
thiserror.workspace = true
uuid = { version = "=1.29.3", features = ["v4"] }
argon2.workspace = true
base64.workspace = true
hex.workspace = true
sha1.workspace = true
sha2.workspace = true
hmac.workspace = true
rand.workspace = true
rsa.workspace = true
p256.workspace = true
p384.workspace = true
ecdsa.workspace = true
signature.workspace = true
subtle.workspace = true
secrecy.workspace = true
zeroize.workspace = true
url.workspace = true
reqwest = { workspace = true, optional = true }
deadpool-redis = { workspace = true, optional = true }
redis = { workspace = true, optional = true }
sqlx = { workspace = true, optional = true }

[dev-dependencies]
rume-data = { workspace = true, features = ["sqlite"] }
tokio = { workspace = true, features = ["test-util"] }

[features]
default = []
sqlite = ["rume-data/sqlite", "dep:sqlx", "sqlx/sqlite"]
postgres = ["rume-data/postgres", "dep:sqlx", "sqlx/postgres"]
mysql = ["rume-data/mysql", "dep:sqlx", "sqlx/mysql"]
redis = ["rume-data/redis", "dep:deadpool-redis", "dep:redis"]
http-client = ["dep:reqwest"]
