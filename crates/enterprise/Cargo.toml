[package]
name = "rume-enterprise"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Enterprise SAML/SCIM integrations and Saga workflow orchestration for Rume."

[dependencies]
rume-foundation.workspace = true
rume-observability.workspace = true
rume-data.workspace = true
tokio.workspace = true
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
thiserror.workspace = true
uuid = { version = "1.29.3", features = ["v4"] }
quick-xml = { workspace = true, optional = true }
saml-rs = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }
bergshamra = { workspace = true, optional = true }
deadpool-redis = { workspace = true, optional = true }
redis = { workspace = true, optional = true }
sqlx = { workspace = true, optional = true }

[dev-dependencies]
opentelemetry.workspace = true
opentelemetry_sdk.workspace = true
proptest.workspace = true
tracing-opentelemetry.workspace = true
tracing-subscriber.workspace = true

[features]
default = []
saml = ["dep:quick-xml", "dep:saml-rs", "dep:chrono", "dep:bergshamra"]
redis = ["dep:deadpool-redis", "dep:redis"]
sqlite = ["rume-data/sqlite", "dep:sqlx", "sqlx/sqlite"]
postgres = ["rume-data/postgres", "dep:sqlx", "sqlx/postgres"]
mysql = ["rume-data/mysql", "dep:sqlx", "sqlx/mysql"]
enterprise = ["saml"]
