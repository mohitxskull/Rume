[package]
name = "rume-enterprise"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Enterprise SAML/SCIM integrations and Saga workflow orchestration for Rume."

[dependencies]
rume-foundation.workspace = true
rume-observability.workspace = true
tokio.workspace = true
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
thiserror.workspace = true
uuid = { version = "=1.29.2", features = ["v4"] }
quick-xml = { version = "=0.42.0", optional = true }
saml-rs = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }

[dev-dependencies]
opentelemetry.workspace = true
opentelemetry_sdk.workspace = true
proptest.workspace = true
tracing-opentelemetry.workspace = true
tracing-subscriber.workspace = true

[features]
default = []
saml = ["dep:quick-xml", "dep:saml-rs", "dep:chrono"]
enterprise = ["saml"]
