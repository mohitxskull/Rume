[package]
name = "rume-foundation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Foundation types, configuration, environment loading, errors, and health contracts for Rume."

[dependencies]
axum.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
thiserror.workspace = true
secrecy.workspace = true
figment.workspace = true
toml.workspace = true
subtle.workspace = true
parking_lot.workspace = true
uuid = { version = "1.29.3", features = ["v4"] }
schemars = { version = "1.2.3", optional = true, features = ["derive"] }

[features]
schemars = ["dep:schemars"]

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
