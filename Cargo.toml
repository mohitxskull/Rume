[workspace]
resolver = "3"
members = [
    "crates/foundation",
    "crates/observability",
    "crates/data",
    "crates/messaging",
    "crates/security",
    "crates/http",
    "crates/enterprise",
    "crates/app",
    "crates/grpc",
    "crates/graphql",
    "crates/testing",
    "crates/core",
    "crates/crash",
    "crates/cli",
    "crates/macro",
    "crates/xtask",
    "workbench/simple-api",
    "workbench/modular-monolith",
    "workbench/multi-instance",
]
exclude = [
    "lab",
    "fuzz",
    "benchmarks/load",
]
default-members = ["crates/core", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
rume-foundation = { path = "crates/foundation", version = "=0.1.0" }
rume-observability = { path = "crates/observability", version = "=0.1.0" }
rume-data = { path = "crates/data", version = "=0.1.0" }
rume-messaging = { path = "crates/messaging", version = "=0.1.0" }
rume-security = { path = "crates/security", version = "=0.1.0" }
rume-http = { path = "crates/http", version = "=0.1.0" }
rume-enterprise = { path = "crates/enterprise", version = "=0.1.0" }
rume-app = { path = "crates/app", version = "=0.1.0" }
rume-grpc = { path = "crates/grpc", version = "=0.1.0" }
rume-graphql = { path = "crates/graphql", version = "=0.1.0" }
rume-testing = { path = "crates/testing", version = "=0.1.0" }
axum = "=0.8.9"
tower = "=0.5.3"
tower-http = { version = "=0.7.1", default-features = false, features = ["cors", "compression-gzip", "compression-br", "compression-zstd", "limit"] }
tokio = { version = "=1.54.1", features = ["full"] }
serde = { version = "=1.0.229", features = ["derive"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "fmt"] }
thiserror = "=2.0.21"
secrecy = { version = "=0.10.3", features = ["serde"] }
figment = { version = "=0.10.19", features = ["toml", "env"] }
dotenvy = "=0.15.7"
url = { version = "=2.5.9", features = ["serde"] }
toml = "=1.2.3"
serde_json = "=1.0.154"

clap = { version = "=4.6.10", features = ["derive"] }
tempfile = "=3.27.0"
sqlx = { version = "=0.9.1", default-features = false, features = ["runtime-tokio", "tls-rustls", "json"] }
sea-query = { version = "=1.0.2", default-features = false, features = ["backend-sqlite", "backend-postgres", "backend-mysql", "thread-safe"] }
# SQL parsing and validation used by `rume sql:check` and `rume-data` transaction/placeholder checks.
# Pinned to an exact version so dialect-aware placeholder, statement, and comment lexing is deterministic.
sqlparser = { version = "=0.64.0", features = ["visitor"] }
# RFC 3339 / ISO 8601 date-time parsing used by SAML assertion condition/instant validation.
# Default features are disabled so consumers that only parse fixed-offset timestamps do not
# pull in `clock`; crates that need `Utc::now()` enable `clock` explicitly.
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
proptest = "=1.12.0"
deadpool-redis = "=0.23.1"
redis = { version = "=1.8.3", default-features = false, features = ["tokio-comp", "script"] }
# SAML 2.0 namespace URNs (used by `crates/enterprise/src/saml/` under the `saml` feature).
# Why: `default-features = false` disables `saml-rs`'s default XML-DSig/legacy-algorithm
# feature pull-through so Cargo feature unification cannot silently re-enable
# `bergshamra/legacy-algorithms` (SHA-1).
saml-rs = { version = "=0.8.0", default-features = false }
# Milestone B security, crypto, JWT/JWKS, OAuth2/OIDC, and XML-DSig dependencies.
argon2 = "=0.6.0"
base64 = "=0.23.1"
hex = "=0.4.3"
sha1 = "=0.11.0"
sha2 = "=0.11.2"
hmac = "=0.13.0"
rand = "=0.10.4"
rsa = { version = "=0.10.0", features = ["pkcs1v15"] }
p256 = "=0.14.0"
p384 = "=0.14.0"
ecdsa = "=0.17.0"
signature = "=3.0.0"
zeroize = "=1.9.2"
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "rustls", "http2"] }
bergshamra = { version = "=0.12.0", default-features = false, features = ["rustcrypto"] }
futures-util = { version = "=0.3.34", default-features = false, features = ["std"] }
testcontainers-modules = { version = "=0.15.0", features = ["postgres", "redis", "mysql"] }
garde = { version = "=0.23.0", features = ["derive", "email", "url"] }
# Constant-time comparison for security-sensitive equality checks (RC-14).
subtle = "=2.6.1"
# Non-poisoning synchronous RwLock/Mutex for hot-path resilience, routing, and health registries.
parking_lot = "=0.13.0"

# Milestone D: cron scheduling, DNS SRV discovery, and external message brokers.
croner = "=5.0.1"
hickory-resolver = "=0.26.4"
async-nats = "=0.53.0"
lapin = "=4.13.0"

# Rust source parsing used by `rume doctor` to validate module DAG acyclicity
# (RC-20). Pinned to match crates/macro. syn::parse_file tokenizes the whole
# file so multi-line rustfmt formatting is handled natively instead of by a
# fragile hand-rolled brace-depth scanner.
syn = { version = "=3.0.10", features = ["full", "visit"] }
proc-macro2 = "=1.0.107"

# OpenTelemetry backbone & tracing bridge (Plan 002).
opentelemetry = "=0.33.1"
opentelemetry_sdk = "=0.33.1"
opentelemetry-otlp = "=0.33.1"
opentelemetry-appender-tracing = "=0.33.1"
tracing-opentelemetry = "=0.34.0"

# Milestone E: TLS, HTTP/2, ACME, static embedding, transactional email, gRPC, and GraphQL.
tokio-rustls = "=0.26.6"
rustls = "=0.23.46"
rustls-pki-types = "=1.16.0"
rustls-pemfile = "=2.2.0"
hyper-util = "=0.1.21"
rustls-acme = "=0.15.4"
rust-embed = "=8.14.0"
lettre = { version = "=0.11.24", default-features = false, features = ["tokio1-rustls-tls", "smtp-transport", "builder", "hostname", "pool"] }
minijinja = "=3.1.0"
tonic = "=0.14.9"
prost = "=0.14.6"
tonic-prost = "=0.14.9"
async-graphql = "=7.2.1"
async-graphql-axum = "=7.2.1"

# Keep dev/test artifacts small. This workspace has many integration test
# binaries that each statically link the full dependency stack (sqlx, axum,
# testcontainers, tonic, ...), and the default `dev` profile embeds full
# debug info, which pushed target/debug past 50 GB. Line tables keep
# backtraces useful while dropping most of that size. The `test` profile
# inherits this setting; use CARGO_PROFILE_DEV_DEBUG=2 for a one-off build
# that needs full debug info.
[profile.dev]
debug = "line-tables-only"
