[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/cli",
    "crates/macro",
    "workbench/simple-api",
    "workbench/modular-monolith",
    "workbench/multi-instance",
]
exclude = [
    "lab",
]
default-members = ["crates/core", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
rume = { path = "crates/core", version = "0.1.0" }

axum = "=0.8.9"
tower = "=0.5.3"
tokio = { version = "=1.54.1", features = ["full", "test-util"] }
serde = { version = "=1.0.229", features = ["derive"] }
tracing = "=0.1.44"
thiserror = "=2.0.21"
secrecy = { version = "=0.10.3", features = ["serde"] }
figment = { version = "=0.10.19", features = ["toml", "env"] }
dotenvy = "=0.15.7"
url = { version = "=2.5.8", features = ["serde"] }
toml = "1.2.0"
serde_json = "1.0.154"

clap = { version = "=4.6.7", features = ["derive"] }
tempfile = "3.27.0"
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "json"] }
deadpool-redis = "=0.23.1"
redis = { version = "=1.8.1", default-features = false, features = ["tokio-comp", "script"] }
futures-util = { version = "=0.3.34", default-features = false, features = ["std"] }
testcontainers-modules = { version = "=0.15.0", features = ["postgres", "redis", "mysql"] }
garde = { version = "=0.23.0", features = ["derive", "email", "url"] }

# Keep dev/test artifacts small. This workspace has many integration test
# binaries that each statically link the full dependency stack (sqlx, axum,
# testcontainers, tonic, ...), and the default `dev` profile embeds full
# debug info, which pushed target/debug past 50 GB. Line tables keep
# backtraces useful while dropping most of that size. The `test` profile
# inherits this setting; use CARGO_PROFILE_DEV_DEBUG=2 for a one-off build
# that needs full debug info.
[profile.dev]
debug = "line-tables-only"
