[workspace]
resolver = "3"
members = [
    "rume",
    "rume-cli",
]
exclude = [
    "lab",
]
default-members = ["rume", "rume-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
rume = { path = "rume", version = "0.1.0" }

axum = "0.8.9"
tokio = { version = "1.54.1", features = ["full", "test-util"] }
serde = { version = "1.0.229", features = ["derive"] }
tracing = "0.1.44"
thiserror = "2.0.21"
secrecy = { version = "0.10.3", features = ["serde"] }
figment = { version = "0.10.19", features = ["toml", "env"] }
dotenvy = "0.15.7"
url = { version = "2.5.8", features = ["serde"] }
toml = "1.1.8"
serde_json = "1.0.139"

clap = { version = "4.6.7", features = ["derive"] }
tempfile = "3.15.0"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "tls-rustls", "json"] }
deadpool-redis = "0.23.1"
redis = { version = "1.8", default-features = false, features = ["tokio-comp", "script"] }
testcontainers-modules = { version = "0.15", features = ["postgres", "redis", "mysql"] }
