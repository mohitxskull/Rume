[workspace]
resolver = "3"
members = [
    "crates/foundation",
    "crates/observability",
    "crates/data",
    "crates/messaging",
    "crates/security",
    "crates/http",
    "crates/enterprise",
    "crates/app",
    "crates/testing",
    "crates/core",
    "crates/crash",
    "crates/cli",
    "crates/macro",
    "crates/xtask",
    "workbench/simple-api",
    "workbench/modular-monolith",
    "workbench/multi-instance",
]
exclude = [
    "lab",
]
default-members = ["crates/core", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
rume-foundation = { path = "crates/foundation", version = "=0.1.0" }
rume-observability = { path = "crates/observability", version = "=0.1.0" }
rume-data = { path = "crates/data", version = "=0.1.0" }
rume-messaging = { path = "crates/messaging", version = "=0.1.0" }
rume-security = { path = "crates/security", version = "=0.1.0" }
rume-http = { path = "crates/http", version = "=0.1.0" }
rume-enterprise = { path = "crates/enterprise", version = "=0.1.0" }
rume-app = { path = "crates/app", version = "=0.1.0" }
rume-testing = { path = "crates/testing", version = "=0.1.0" }
axum = "=0.8.9"
tower = "=0.5.3"
tokio = { version = "=1.54.1", features = ["full", "test-util"] }
serde = { version = "=1.0.229", features = ["derive"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "fmt"] }
thiserror = "=2.0.21"
secrecy = { version = "=0.10.3", features = ["serde"] }
figment = { version = "=0.10.19", features = ["toml", "env"] }
dotenvy = "=0.15.7"
url = { version = "=2.5.8", features = ["serde"] }
toml = "1.2.0"
serde_json = "1.0.154"

clap = { version = "=4.6.7", features = ["derive"] }
tempfile = "3.27.0"
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "json"] }
# SQL parsing and validation used by `rume sql:check` and `rume-data` transaction/placeholder checks.
# Pinned to an exact version so dialect-aware placeholder, statement, and comment lexing is deterministic.
sqlparser = "=0.64.0"
# RFC 3339 / ISO 8601 date-time parsing used by SAML assertion condition/instant validation.
# Default features are disabled so consumers that only parse fixed-offset timestamps do not
# pull in `clock`; crates that need `Utc::now()` enable `clock` explicitly.
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
proptest = "=1.12.0"
deadpool-redis = "=0.23.1"
redis = { version = "=1.8.2", default-features = false, features = ["tokio-comp", "script"] }
# SAML 2.0 namespace URNs (used by `crates/enterprise/src/enterprise/saml.rs` under the
# `saml` feature). `saml-rs` supplies only the SAML/XML-DSig/Protocol namespace constants;
# XML traversal uses `quick-xml`, RFC 3339 timestamps use `chrono`, and cryptographic
# XML-DSig verification is delegated to the pluggable `SamlSignatureVerifier` boundary.
saml-rs = "=0.8.0"
futures-util = { version = "=0.3.34", default-features = false, features = ["std"] }
testcontainers-modules = { version = "=0.15.0", features = ["postgres", "redis", "mysql"] }
garde = { version = "=0.23.0", features = ["derive", "email", "url"] }
# Constant-time comparison for security-sensitive equality checks (RC-14).
subtle = "=2.6.1"
# Non-poisoning synchronous RwLock/Mutex for hot-path resilience, routing, and health registries.
parking_lot = "=0.12.5"

# Rust source parsing used by `rume doctor` to validate module DAG acyclicity
# (RC-20). Pinned to match crates/macro. syn::parse_file tokenizes the whole
# file so multi-line rustfmt formatting is handled natively instead of by a
# fragile hand-rolled brace-depth scanner.
syn = { version = "=3.0.10", features = ["full", "visit"] }
proc-macro2 = "=1.0.107"

# OpenTelemetry backbone & tracing bridge (Plan 002).
opentelemetry = "=0.33.1"
opentelemetry_sdk = "=0.33.1"
opentelemetry-otlp = "=0.33.1"
opentelemetry-appender-tracing = "=0.33.1"
tracing-opentelemetry = "=0.34.0"

# Keep dev/test artifacts small. This workspace has many integration test
# binaries that each statically link the full dependency stack (sqlx, axum,
# testcontainers, tonic, ...), and the default `dev` profile embeds full
# debug info, which pushed target/debug past 50 GB. Line tables keep
# backtraces useful while dropping most of that size. The `test` profile
# inherits this setting; use CARGO_PROFILE_DEV_DEBUG=2 for a one-off build
# that needs full debug info.
[profile.dev]
debug = "line-tables-only"

# Why: third-party crates (`sqlx`, `tonic`, `opentelemetry`, `sqlparser`, etc.) bloat
# `target/` and link times when compiled with full DWARF (`debug = 2`); `line-tables-only`
# preserves file:line backtraces while keeping full debug info for workspace crates.
[profile.dev.package."*"]
debug = "line-tables-only"
