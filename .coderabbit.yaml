# yaml-language-server: $schema=https://www.coderabbit.ai/integrations/schema.v2.json
tone_instructions: >-
  Be concise and root-cause-focused. Cite falsifiable evidence (concrete input, interleaving,
  attack, or violated invariant). Never suggest compat shims, deprecation layers, semver bumps, or
  separate markdown docs as fixes.
reviews:
  profile: assertive
  path_filters:
    - "!docs/plans/**"
    - "!docs/reports/**"
    - "!docs/scratch/**"
    - "!**/scratch/**"
  path_instructions:
    - path: crates/**
      instructions: >-
        Enforce #![forbid(unsafe_code)], avoid unwrap()/expect() in non-test production code,
        preserve W3C TraceContext propagation and OpenTelemetry span bridging across async boundaries,
        and keep SQL assets and templates strictly owned by their crate. Enforce crate layering
        (foundation -> observability/enterprise -> data -> messaging/security -> http -> app ->
        testing -> core/cli). Treat code, tests/types, and inline Why: comments as the single source
        of truth: verify Why: comments against actual behavior and flag stale or divergent comments
        as defects. Breaking changes are allowed without compatibility shims, but flag half-migrations
        where call sites, schemas, tests, or comments are not updated atomically. Flag anti-patterns
        with concrete evidence: hidden global state, log-and-continue on failure paths, non-idempotent
        retries, unbounded queues, test-only production branches, and dead code.
    - path: crates/**/tests/**
      instructions: >-
        Enforce deterministic, asserting tests: flag time-based sleeps (tokio::time::sleep),
        assertion-free tests, over-mocking of real databases or core engines, and missing regression
        or property-based coverage for parsers and scanners. unwrap()/expect() is acceptable in test
        assertions and fixtures where failure should panic the test.
    - path: crates/testing/**
      instructions: >-
        Enforce deterministic test harnesses and fixtures: flag detached async Drop cleanup,
        time-based sleeps, silent test skips, and mocks of real DB/security behavior.
    - path: "**/Cargo.toml"
      instructions: >-
        Enforce exact '=' dependency version pins, keep internal harnesses publish = false, and keep
        runtime [dependencies] on the umbrella rume crate minimal (test/harness deps belong in
        [dev-dependencies] or dedicated publish = false crates).
    - path: workbench/**
      instructions: >-
        Reference application scenarios (simple-api, modular-monolith, multi-instance) must use the
        public rume umbrella API and prelude, avoid bypassing framework module/persistence boundaries,
        and keep compose/Docker configs, SQL assets, and test/SLA assertions deterministic.
