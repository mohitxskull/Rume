# yaml-language-server: $schema=https://www.coderabbit.ai/integrations/schema.v2.json
reviews:
  profile: assertive
  path_filters:
    - "!docs/plans/**"
    - "!docs/reports/**"
    - "!docs/scratch/**"
    - "!**/scratch/**"
  path_instructions:
    - path: crates/**
      instructions: >-
        Enforce #![forbid(unsafe_code)], avoid unwrap()/expect() in non-test production code,
        preserve W3C TraceContext propagation and OpenTelemetry span bridging across async boundaries,
        and keep SQL assets, templates, and Cargo dependency pins strictly scoped to their owning crate.
    - path: workbench/**
      instructions: >-
        Reference application scenarios (simple-api, modular-monolith, multi-instance) must use the
        public rume umbrella API and prelude, avoid bypassing framework module/persistence boundaries,
        and keep compose/Docker configs, SQL assets, and test/SLA assertions deterministic.
