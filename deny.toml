# deny.toml — Generated by `peer init` for cargo-deny 0.22+
# Docs: https://embarkstudios.github.io/cargo-deny/

[advisories]
unmaintained = "workspace"
yanked = "warn"
ignore = [
  # RUSTSEC-2026-0459: libsqlite3-sys < 0.39.0 (CVE-2026-119375, local crafted -wal file exposure).
  # Blocked upstream: sqlx-sqlite 0.9.1 constrains libsqlite3-sys to < 0.38 (resolved version is 0.30.1).
  # Revisit and remove this entry as soon as a new sqlx-sqlite release allows libsqlite3-sys >= 0.39.0.
  "RUSTSEC-2026-0459",
  # RUSTSEC-2026-0543: chrono 0.4.45 is unmaintained (used in rume-cli/rume-messaging and via croner/bergshamra).
  # Revisit and remove once workspace and upstream crates migrate to `jiff`/`time`.
  "RUSTSEC-2026-0543",
]

[licenses]
confidence-threshold = 0.8
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Unlicense",
  "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
