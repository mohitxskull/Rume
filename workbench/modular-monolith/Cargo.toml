[package]
name = "workbench-modular-monolith"
version = "0.1.0"
edition = "2024"

[dependencies]
rume = { path = "../../crates/core", features = ["sqlite", "testing"] }
axum = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { version = "=1.29.0", features = ["v4"] }

[dev-dependencies]
reqwest = { version = "=0.13.5", default-features = false, features = ["json"] }
