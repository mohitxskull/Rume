[package]
name = "workbench"
version = "0.1.0"
edition = "2024"

[dependencies]
rume = { path = "../../rume", features = ["postgres", "redis"] }
axum = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
sqlx = { workspace = true }
uuid = { version = "=1.29.0", features = ["v4", "serde"] }
redis = { workspace = true }
deadpool-redis = { workspace = true }
garde = { workspace = true, features = ["derive", "email", "url"] }

[dev-dependencies]
testcontainers-modules = { workspace = true }
tower = { workspace = true }
reqwest = { version = "=0.13.5", default-features = false, features = ["json"] }

[[bench]]
name = "baseline"
harness = false

