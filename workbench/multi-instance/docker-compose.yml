services:
  postgres:
    image: postgres:16-alpine
    container_name: rume-workbench-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: workbench
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d workbench"]
      interval: 2s
      timeout: 2s
      retries: 25
      start_period: 2s

  redis:
    image: redis:alpine
    container_name: rume-workbench-redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 25
      start_period: 1s

  workbench-1:
    image: rume-workbench:test
    container_name: rume-workbench-api-1
    build:
      context: ../..
      dockerfile: workbench/multi-instance/Dockerfile.local
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/workbench
      REDIS_URL: redis://redis:6379
      RUST_LOG: info,workbench=debug,rume=debug
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 2s
      timeout: 2s
      retries: 25
      start_period: 3s

  workbench-2:
    image: rume-workbench:test
    container_name: rume-workbench-api-2
    build:
      context: ../..
      dockerfile: workbench/multi-instance/Dockerfile.local
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/workbench
      REDIS_URL: redis://redis:6379
      RUST_LOG: info,workbench=debug,rume=debug
    ports:
      - "8082:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 2s
      timeout: 2s
      retries: 25
      start_period: 3s
