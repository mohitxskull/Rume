services:
  postgres:
    image: postgres:16-alpine
    container_name: rume-workbench-postgres-prod
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-workbench}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-workbench}"]
      interval: 2s
      timeout: 2s
      retries: 25
      start_period: 2s

  redis:
    image: redis:7-alpine
    container_name: rume-workbench-redis-prod
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 25
      start_period: 1s

  workbench-1:
    image: rume-workbench:latest
    container_name: rume-workbench-api-1-prod
    build:
      context: ../..
      dockerfile: workbench/multi-instance/Dockerfile
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      RUST_LOG: info
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 2s
      timeout: 2s
      retries: 25
      start_period: 3s

  workbench-2:
    image: rume-workbench:latest
    container_name: rume-workbench-api-2-prod
    build:
      context: ../..
      dockerfile: workbench/multi-instance/Dockerfile
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      RUST_LOG: info
    ports:
      - "8082:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 2s
      timeout: 2s
      retries: 25
      start_period: 3s
