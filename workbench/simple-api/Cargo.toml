[package]
name = "workbench-simple-api"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "workbench-simple-api"
path = "src/main.rs"

[dependencies]
rume = { path = "../../crates/core", features = ["sqlite", "testing"] }
axum = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
garde = { version = "=0.23.0", features = ["derive"] }
uuid = { version = "=1.29.2", features = ["v4"] }

[dev-dependencies]
reqwest = { version = "=0.13.5", default-features = false, features = ["json"] }
