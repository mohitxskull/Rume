name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: verify release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny
      - name: Security audit and dependency policy check
        run: |
          cargo audit
          cargo deny check
      - name: Verify crate packaging
        run: |
          cargo package -p rume-macros --allow-dirty
          for pkg in rume-foundation rume-observability rume-data rume-messaging rume-security rume-http rume-enterprise rume-app rume-grpc rume-graphql rume-testing rume rume-cli; do
            cargo package --list -p "$pkg" --allow-dirty > /dev/null
          done
          cargo test -p rume --lib --features testing
          cargo test -p rume-cli
          cargo test -p rume-macros

  build-cli:
    name: build rume-cli (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    needs: [verify]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build release binary
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --release -p rume-cli --bin rume --target "${TARGET}"
      - name: Package binary and checksum
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p dist
          ARCHIVE="rume-${RELEASE_TAG}-${TARGET}.tar.gz"
          tar -C "target/${TARGET}/release" -czf "dist/${ARCHIVE}" rume
          if command -v sha256sum >/dev/null 2>&1; then
            (cd dist && sha256sum "${ARCHIVE}" > "${ARCHIVE}.sha256")
          else
            (cd dist && shasum -a 256 "${ARCHIVE}" > "${ARCHIVE}.sha256")
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: rume-cli-${{ matrix.target }}
          path: dist/*

  release:
    name: publish github release
    runs-on: ubuntu-latest
    needs: [build-cli]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: artifacts/*
