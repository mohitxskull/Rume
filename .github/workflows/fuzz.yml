name: Fuzz

on:
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:
    inputs:
      duration_secs:
        description: "Max fuzz duration per target (seconds)"
        required: false
        default: "30"

permissions:
  contents: read

jobs:
  fuzz:
    name: fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - saml_parser
          - scim_deser
          - sql_validators
          - trace_context
          - env_interpolation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: nightly
      - uses: taiki-e/install-action@073e1fd0bc889c9aee68dbaaa927cde1b5653a83 # v2
        with:
          tool: cargo-fuzz
      - name: Run cargo-fuzz smoke pass
        env:
          DURATION_SECS: ${{ inputs.duration_secs || '30' }}
        run: cargo +nightly fuzz run "${{ matrix.target }}" -- -max_total_time="${DURATION_SECS}"
      - name: Upload crashing fuzz artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}/
          if-no-files-found: ignore
