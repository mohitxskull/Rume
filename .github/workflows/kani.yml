name: Kani Formal Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kani:
    name: Kani proofs (rume-foundation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Run Kani
        uses: model-checking/kani-github-action@v1
        with:
          working-directory: crates/foundation
