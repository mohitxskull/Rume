name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: rustfmt check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --workspace --all-targets

  test:
    name: test (${{ matrix.crate }})
    runs-on: ubuntu-latest
    needs: [fmt, clippy]
    strategy:
      fail-fast: false
      matrix:
        crate: [rume, rume-cli, rume-macros, workbench/simple-api, workbench/modular-monolith]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: workbench
        options: >-
          --health-cmd "pg_isready -U postgres -d workbench"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 25
        ports:
          - 5432:5432
      redis:
        image: redis:alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 25
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - name: Build and test ${{ matrix.crate }}
        run: cargo test -p ${{ matrix.crate }} --all-targets
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/workbench
          REDIS_URL: redis://localhost:6379

  compose-qualification:
    name: compose qualification (Phase 7.2)
    runs-on: ubuntu-latest
    needs: [test]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: workbench
        options: >-
          --health-cmd "pg_isready -U postgres -d workbench"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 25
        ports:
          - 5432:5432
      redis:
        image: redis:alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 25
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Docker Compose
        run: |
          sudo apt-get update
          sudo apt-get install -y docker-compose-plugin
      - name: Build release workbench binary
        run: cargo build --release -p workbench --bin workbench
      - name: Run Docker Compose multi-instance system test
        run: cargo test -p workbench --test compose_system_test -- --nocapture
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/workbench
          REDIS_URL: redis://localhost:6379
