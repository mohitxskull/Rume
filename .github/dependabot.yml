version: 2
updates:
  # Enable version updates for Rust workspace dependencies
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    reviewers:
      - "mohitxskull"
    labels:
      - "dependencies"
      - "rust"
    groups:
      rust-minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # Enable version updates for GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    reviewers:
      - "mohitxskull"
    labels:
      - "dependencies"
      - "ci"
    ignore:
      # Why: `dtolnay/rust-toolchain@1.96` in ci.yml intentionally pins the workspace MSRV.
      - dependency-name: "dtolnay/rust-toolchain"
    groups:
      github-actions:
        patterns:
          - "*"
